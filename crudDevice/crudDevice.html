<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Dispositivos Apple</title>
    <link rel="stylesheet" href="../crudDevice.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <h1>Administrador de Dispositivos</h1>
    <div id="crud-container">
        <form id="device-form">
            <div class="form-group">
                <label for="deviceType">Tipo de Dispositivo</label>
                <select id="deviceType" name="deviceType" required>
                    <option value="" disabled selected>Seleccione un tipo</option>
                    <option value="/Iphone/jsons/allPhonesInfo.json">iPhone</option>
                    <option value="/Iphone/jsons/alliPadInfo.json">iPad</option>
                    <option value="/Iphone/jsons/allMacbookAirInfo.json">MacBook Air</option>
                    <option value="/Iphone/jsons/allSmartwatchInfo.json">Apple Watch</option>
                    <option value="/Iphone/jsons/allIMacInfo.json">iMac</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="deviceName">Nombre del Dispositivo</label>
                <input type="text" id="deviceName" name="deviceName" required placeholder="Ej: iPhone 15 Pro">
            </div>
            
            <div class="form-group">
                <label for="model">Modelo</label>
                <input type="text" id="model" name="model" required placeholder="Ej: A2849">
            </div>
            
            <div class="form-group">
                <label for="ram">Memoria RAM</label>
                <input type="text" id="ram" name="ram" placeholder="Ej: 8GB">
            </div>
            
            <div class="form-group">
                <label for="storage">Almacenamiento</label>
                <input type="text" id="storage" name="storage" placeholder="Ej: 256GB">
            </div>
            
            <div class="form-group">
                <label for="appleOrderNo">Número de Orden Apple</label>
                <input type="text" id="appleOrderNo" name="appleOrderNo" placeholder="Ej: MLXY3LL/A">
            </div>
            
            <div class="form-group">
                <label for="releaseDate">Fecha de Lanzamiento</label>
                <input type="date" id="releaseDate" name="releaseDate">
            </div>
            
            <div class="form-group">
                <label for="color">Color</label>
                <input type="text" id="color" name="color" placeholder="Ej: Titanio Natural">
            </div>
            
            <div class="form-actions">
                <button type="button" id="add-button">
                    <i class="material-icons" style="vertical-align: middle; margin-right: 5px;">add</i>
                    Agregar
                </button>
                <button type="button" id="update-button" disabled>
                    <i class="material-icons" style="vertical-align: middle; margin-right: 5px;">update</i>
                    Actualizar
                </button>
            </div>
        </form>
        
        <div id="device-list">
            <h2><i class="material-icons" style="vertical-align: middle;">devices</i> Lista de Dispositivos</h2>
            <ul id="devices">
                <!-- Los dispositivos se agregarán aquí dinámicamente -->
            </ul>
        </div>
    </div>
    
    <a href="/home.html" id="back-to-home">
        <i class="material-icons" style="vertical-align: middle;">arrow_back</i>
        Volver al inicio
    </a>
    
    <script src="../crudDevice.js"></script>
</body>
</html>
