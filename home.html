<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Dispositivos Apple</title>
    <link rel="stylesheet" href="../index.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <img src="../Logo_oficial.png" alt="Logo Reconext" class="app-logo">
                <h1 class="app-title">Listado de Dispositivos Apple</h1>
                <nav class="app-nav">
                    <a href="/logout" class="logout-button">
                        <i class="material-icons">logout</i>
                        <span>Cerrar sesión</span>
                    </a>
                </nav>
            </div>
        </header>

        <div class="toolbar">
            <div class="search-container">
                <i class="material-icons search-icon">search</i>
                <input type="search" placeholder="Buscar dispositivos..." class="search-input" id="Buscador">
                <button class="refresh-button" id="refreshButton">
                    <i class="material-icons">refresh</i>
                    <span>Actualizar</span>
                </button>
            </div>

            <div class="filter-buttons" id="filters">
                <button class="filter-button active" data-filter="iphones">
                    <i class="material-icons">smartphone</i>
                    <span>iPhone</span>
                </button>
                <button class="filter-button" data-filter="ipads">
                    <i class="material-icons">tablet</i>
                    <span>iPad</span>
                </button>
                <button class="filter-button" data-filter="imacbook">
                    <i class="material-icons">laptop_mac</i>
                    <span>MacBook</span>
                </button>
                <button class="filter-button" data-filter="applewatches">
                    <i class="material-icons">watch</i>
                    <span>Apple Watch</span>
                </button>
                <button class="filter-button" data-filter="imacs">
                    <i class="material-icons">desktop_mac</i>
                    <span>iMac</span>
                </button>
                <button class="admin-button" id="crud" onclick="location.href='../../crudDevice.html'">
                    <i class="material-icons">settings</i>
                    <span>Administrar</span>
                </button>
            </div>
        </div>

        <!-- Spinner mejorado -->
        <div id="loadingSpinner" class="loading-container">
            <div class="spinner-container">
                <div class="spinner-circle">
                    <div class="spinner-inner-circle"></div>
                </div>
                <div class="spinner-gradient"></div>
            </div>
            <p class="loading-text">Actualizando datos...</p>
            <p class="loading-subtext">Por favor espere</p>
        </div>

        <main class="device-grid" id="phone-list">
            <!-- Dispositivos cargados dinámicamente -->
        </main>
    </div>

    <button class="toTop" id="toTop">
        <svg viewBox="0 0 24 24">
          <path d="m4 16 8-8 8 8"></path>
        </svg>
    </button>

    <script type="module" src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch("/getUserType", {
                credentials: 'include'
            })
            .then((response) => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then((data) => {
                if (data.role === 'user') {
                    document.getElementById("crud").style.display = "none";
                    document.getElementById("refreshButton").style.display = "none";
                }
            })
            .catch((error) => {
                console.error("Error al obtener el userType:", error);
            });
        });
    </script>
</body>
</html>
