<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Dispositivos Apple</title>
    <link rel="stylesheet" href="../index.css">
</head>
<body>
    <div class="header">
        <img src="../Logo_oficial.png" alt="Apple Logo" id="reconextLogo">
        <h1>Listado de Dispositivos Apple</h1>
        <a href="/logout" id="back-to-home">Cerrar sesión</a>
    </div>

    <div id="filters">
        <button data-filter="iphones">iPhone</button>
        <button data-filter="ipads">iPad</button>
        <button data-filter="imacbook">MacBook</button>
        <button data-filter="applewatches">Apple Watch</button>
        <button data-filter="imacs">iMac</button>
        <button id="crud" onclick="location.href='../../crudDevice.html'">Administrar Dispositivo</button>
    </div>

    <div id="search">
        <input type="search" placeholder="Busca tu Archivo" id="Buscador" />
        <button id="refreshButton">Actualizar</button>
    </div>

    <div id="loadingSpinner" style="display: none; text-align: center; margin: 20px 0;">
        <div class="spinner"></div>
        <p style="color: rgb(77, 179, 85);">Actualizando datos...</p>
    </div>
    <div id="phone-list"></div>
    <script type="module" src="../script.js"></script>
    <script>
        // Hacer una petición a la API para obtener el role
        document.addEventListener('DOMContentLoaded', function() {
        fetch("/getUserType", {
            credentials: 'include' // Importante para incluir cookies de sesión
        })
        .then((response) => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then((data) => {
            console.log("role recibido:", data.role); // Debug
            if (data.role === 'user') {
                document.getElementById("crud").style.display = "none";
                document.getElementById("refreshButton").style.display = "none";
            }
        })
        .catch((error) => {
            console.error("Error al obtener el role:", error);
        });
    });
    </script>
</body>
</html>
